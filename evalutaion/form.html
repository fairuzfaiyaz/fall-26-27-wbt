<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donor's Information</title>
  </head>

  <body>
    <form method="POST">
      <h2>Donor's Information</h2>
      <table>
        <tr>
          <td>
            <label for="firstname">First Name*</label>
          </td>
          <td>
            <input
              type="text"
              id="firstname"
              name="firstname"
              placeholder="hello"
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="lastname">Last Name*</label>
          </td>
          <td>
            <input type="text" id="lastname" name="lastname" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="company">Company*</label>
          </td>
          <td>
            <input type="text" id="company" name="company" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="address1">Address 1*</label>
          </td>
          <td>
            <input type="text" id="address1" name="address1" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="address2">Address 2</label>
          </td>
          <td>
            <input type="text" id="address2" name="address2" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="city">City*</label>
          </td>
          <td>
            <input type="text" id="city" name="city" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="state">State*</label>
          </td>
          <td>
            <select id="state" name="state">
              <option>Select a State</option>
              <option>Dhaka</option>
              <option>Rajshahi</option>
              <option>Chittagong</option>
              <option>Sylhet</option>
              <option>Khulna</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <label for="zipcode">Zip Code*</label>
          </td>
          <td>
            <input type="number" id="zipcode" name="zipcode" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="country">Country*</label>
          </td>
          <td>
            <select id="state" name="state">
              <option>Select a Country</option>
              <option>Bangladesh</option>
              <option>India</option>
              <option>Pakistan</option>
              <option>Russia</option>
              <option>China</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <label for="phone">Phone</label>
          </td>
          <td>
            <input type="number" id="phone" name="phone" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="fax">Fax</label>
          </td>
          <td>
            <input type="number" id="fax" name="fax" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="email">Email*</label>
          </td>
          <td>
            <input type="email" id="email" name="email" required />
          </td>
        </tr>

        <tr>
          <td>
            <label
              >Donation Amount* <br />(check a button or type in your
              <br />amount)
            </label>
          </td>
          <td>
            <input type="radio" name="donation" value="none" />None
            <input type="radio" name="donation" value="$50" />$50
            <input type="radio" name="donation" value="$75" />$75
            <input type="radio" name="donation" value="$100" />$100
            <input type="radio" name="donation" value="$250" />$250
            <input type="radio" name="donation" value="other" />Other
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <label for="otheramount">Other Amount $ </label>
            <input type="number" id="otheramount" name="otheramount" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="recurringdonation"
              >Recurring Donation <br />(Check if yes)</label
            >
          </td>
          <td>
            <input type="checkbox" value="recurringdonation" required />I am
            interested in giving on a regular basis.
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <label for="monthlycredit">Monthly Credit Card $</label>

            <input
              type="number"
              id="monthlycredit"
              name="monthlycredit"
              required
            />

            <label for="monthlycreditformonths">For</label>

            <input
              type="number"
              id="monthlycreditformonths"
              name="monthlycreditformonths"
              required
            />
            <label>Months</label>
          </td>
        </tr>
      </table>
      <h1>Honorarium and Memorial Donation Information</h1>
      <table>
        <tr>
          <td>
            <label for="todonate"></label>I would like to make this donation
          </td>
          <td>
            <input
              type="radio"
              name="todonate"
              id="todonate"
              value="tohonor"
            />To Honor <br />
            <input
              type="radio"
              name="todonate"
              id="todonate"
              value="tohonor"
            />To Memory of
          </td>
        </tr>
        <tr>
          <td><label for="name1">Name</label></td>
          <td><input type="text" name="name1" id="name1" /></td>
        </tr>
        <tr>
          <td><label for="Acknowledge">Acknowledge Donation to </label></td>
          <td><input type="text" name="Acknowledge" id="Acknowledge" /></td>
        </tr>
        <tr>
          <td><label for="address3">Address</label></td>
          <td><input type="text" name="address3" id="address3" /></td>
        </tr>

        <tr>
          <td><label for="city1">City </label></td>
          <td><input type="text" name="city1" id="city1" /></td>
        </tr>
        <tr>
          <td>
            <label for="state">State</label>
          </td>
          <td>
            <select id="state" name="state">
              <option>Select a State</option>
              <option>Dhaka</option>
              <option>Rajshahi</option>
              <option>Chittagong</option>
              <option>Sylhet</option>
              <option>Khulna</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <label for="zipcode">Zip Code</label>
          </td>
          <td>
            <input type="number" id="zipcode1" name="zipcode1" />
          </td>
        </tr>

        <tr>
          <td></td>
          <td>
            <button type="reset">Reset</button>
            <button type="submit">Continue</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
